<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video and Words Study</title>
<link rel="stylesheet" href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css">
<style>
  :root { --bg:#fff; --fg:#1d2330; --muted:#5b6475; --accent:#2f5fd0; --line:#cfd6e4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171f; --fg:#e8ebf2; --muted:#9aa3b5; --accent:#7aa2ff; --line:#2c3344; } }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { background:var(--bg); color:var(--fg); }
  body { font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
         font-size:18px; line-height:1.5; margin:0; padding:0 16px env(safe-area-inset-bottom); }
  .jspsych-content { max-width:640px; text-align:left; }
  .jspsych-display-element { background:var(--bg); }
  .zh { color:var(--muted); font-size:.95em; }
  .hint { color:var(--muted); font-size:.9em; min-height:1.4em; }
  .textblock { text-align:left; }
  .prompt, p { text-align:left; }
  .jspsych-btn { font-size:18px; padding:12px 18px; margin:6px 4px; min-height:48px; border:1px solid var(--line);
                 border-radius:10px; background:var(--bg); color:var(--fg); }
  .jspsych-btn:not([disabled]):active { background:var(--accent); color:#fff; }
  .jspsych-btn[disabled] { opacity:.4; }
  .jspsych-btn-group-flex, .jspsych-btn-group-grid { display:flex !important; flex-wrap:wrap; justify-content:center; gap:6px; }
  .jspsych-btn { white-space:normal; max-width:100%; box-sizing:border-box; text-align:left; }
  .clips, .opts { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .opts .jspsych-btn { flex:1 1 45%; }
  .linkbtn { background:none; border:none; color:var(--muted); text-decoration:underline; font-size:14px; padding:12px 0; }
  .form input[type=text], .form input[type=number] { font-size:18px; padding:8px; width:100%; max-width:320px; box-sizing:border-box;
        background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; }
  .form label { display:inline-block; margin:4px 12px 4px 0; }
  .form input[type=radio] { transform:scale(1.3); margin-right:6px; }
  #vwrap { position:relative; background:#000; width:100%; }
  #vwrap video { width:100%; max-height:80vh; display:block; background:#000; }
  #vwrap:fullscreen { display:flex; align-items:center; justify-content:center; width:100vw; height:100vh; }
  #vwrap:fullscreen video, #vwrap:-webkit-full-screen video { width:100%; height:100%; max-height:none; object-fit:contain; }
  #voverlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.55); }
  #voverlay .jspsych-btn { background:#fff; color:#000; }
  .stem { font-size:20px; }
</style>
</head>
<body>
<script src="https://unpkg.com/jspsych@8.3.0/dist/index.browser.min.js"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0/dist/index.browser.min.js"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0/dist/index.browser.min.js"></script>
<script src="config.js"></script>
<script src="experiment.js"></script>
</body>
</html>
